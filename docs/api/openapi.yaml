openapi: 3.1.0
info:
  title: Merit System Personel Polri API
  version: 1.0.0
  description: REST API untuk identitas personel, kualifikasi, riwayat jabatan, mutasi, serta profil merit berbasis scope organisasi.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Development lokal
tags:
  - name: Authentication
  - name: Pengguna
  - name: Personel
  - name: Kualifikasi
  - name: Riwayat Jabatan
  - name: Proses Jabatan
  - name: Referensi
  - name: Administrasi Referensi
  - name: Profil Merit
paths:
  /personnel-integration:
    get:
      tags: [Personel]
      summary: Metadata sumber simulasi dan sepuluh laporan terakhir
      description: Khusus Admin SSDM/System Admin. Prototype true, connected false; tidak terhubung ke SIPP. Checkpoint berupa versi simulasi.
      responses:
        '200': { description: 'Metadata, checkpoint, enabled dan runs' }
        '401': { description: Belum login }
        '403': { description: Bukan admin }
  /personnel-integration/preview:
    post:
      tags: [Personel]
      summary: Buat pratinjau impor personel simulasi
      description: Tidak mengubah personel. Maksimal 100 record / empat halaman sumber. Kode referensi, pendidikan wajib dan jabatan awal divalidasi; NRP tanpa pemetaan/arsip menjadi konflik. Hanya local/testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, version]
              properties:
                mode: { type: string, enum: [initial, delta] }
                version: { type: integer, enum: [1, 2] }
      responses:
        '201':
          description: Laporan pratinjau tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonnelIntegrationReport' }
        '401': { description: Belum login }
        '403': { description: Bukan admin }
        '422': { description: Input/manifest tidak valid atau versi mundur }
        '503': { description: Simulasi write dinonaktifkan di luar local/testing }
  /personnel-integration/{run}:
    parameters:
      - { in: path, name: run, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Personel]
      summary: Baca laporan impor tersimpan, maksimal 25 item per halaman
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        '200':
          description: Laporan tanpa payload sumber penuh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonnelIntegrationReport' }
        '401': { description: Belum login }
        '403': { description: Bukan admin }
        '404': { description: Run tidak ditemukan }
        '422': { description: Pagination tidak valid }
  /personnel-integration/{run}/apply:
    parameters:
      - { in: path, name: run, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Personel]
      summary: Konfirmasi dan proses batch tersimpan
      description: Maksimal 25 item; savepoint per item. Run selesai idempotent. Checkpoint hanya maju tanpa konflik/gagal. Riwayat lokal/arsip dipertahankan; tombstone dilewati. Identitas dasar saja dapat diperbarui; penempatan/jabatan/status/pendidikan memerlukan proses manual. Hanya local/testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, const: true }
                batch_size: { type: integer, minimum: 1, maximum: 25, default: 25 }
      responses:
        '200':
          description: Laporan sesudah batch, baca status sebelum melanjutkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonnelIntegrationReport' }
        '401': { description: Belum login }
        '403': { description: Bukan admin }
        '404': { description: Run tidak ditemukan }
        '409': { description: Baseline checkpoint berubah; buat pratinjau baru }
        '422': { description: Konfirmasi atau ukuran batch tidak valid }
        '503': { description: Simulasi write dinonaktifkan di luar local/testing }
  /personel/{personel}/disiplin-prototype:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
    get:
      tags: [Profil Merit]
      summary: Riwayat disiplin dan kode etik DEMO, hanya baca
      description: Khusus System Admin dan Admin SSDM. Data sintetis prototype, bukan keputusan nyata; belum terhubung ke Propam atau delta sync. Maksimum 15 per halaman, tanggal keputusan terbaru dahulu. Catatan dibatalkan tetap tampil dengan statusnya. Tidak tersedia POST/PUT/DELETE.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Data demo berhalaman; kosong bukan bukti tidak pernah melanggar
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  integration:
                    type: object
                    properties:
                      status: { const: prototype }
                      connected: { const: false }
                      source: { const: prototype_demo }
                      last_synced_at: { type: 'null' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        source_system: { const: prototype_demo }
                        source_record_id: { type: string }
                        jenis: { type: string, enum: [disiplin, kode_etik] }
                        ringkasan: { type: string }
                        nomor_keputusan: { type: string }
                        tanggal_keputusan: { type: string, format: date }
                        sanksi: { type: string }
                        instansi_penerbit: { type: string }
                        status_keputusan: { type: string, enum: [final, dibatalkan] }
                        keterangan_pembatalan: { type: [string, 'null'] }
                        source_updated_at: { type: [string, 'null'], format: date-time }
                        synced_at: { type: [string, 'null'], format: date-time }
                  meta: { type: object }
                  links: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard:
    get:
      tags: [Personel]
      summary: Ringkasan faktual sesuai scope aktif dan role
      description: Jumlah personel per status, kualifikasi, jabatan aktif, unit, dan maksimal lima profil terakhir diperbarui. Soft-deleted tidak dihitung. Operator tidak menerima hitungan akun; Admin SSDM hanya hitungan akun Operator. Tanpa scope aktif menghasilkan ringkasan kosong.
      responses:
        '200':
          description: Ringkasan cakupan akses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      scope:
                        type: object
                        properties:
                          global: { type: boolean }
                          unit_count: { type: integer }
                      personnel:
                        type: object
                        properties:
                          total: { type: integer }
                          aktif: { type: integer }
                          pensiun: { type: integer }
                          nonaktif: { type: integer }
                      qualifications: { type: integer }
                      active_positions: { type: integer }
                      accounts:
                        type: [object, 'null']
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          label: { type: string }
                      recent_personnel:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            nama_lengkap: { type: string }
                            unit: { type: string }
                            status: { type: string }
                            updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system-status:
    get:
      tags: [Pengguna]
      summary: Pemeriksaan teknis read-only khusus System Admin
      description: Menguji koneksi database saat diminta. Tidak menampilkan kredensial, tidak mengukur uptime, dan tidak mengubah konfigurasi.
      responses:
        '200':
          description: Koneksi database berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      database: { type: string, enum: [connected] }
                      database_driver: { type: string }
                      php_version: { type: string }
                      laravel_version: { type: string }
                      checked_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login dan buat token Sanctum
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin.ssdm@example.test
              password: Password123!
              device_name: postman
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      token_type: { type: string, example: Bearer }
                      user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Profil pengguna aktif dan scope-nya
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Cabut token yang sedang digunakan
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /users:
    get:
      tags: [Pengguna]
      summary: Daftar pengguna sesuai kewenangan pengelola
      description: System Admin melihat seluruh akun; Admin SSDM hanya melihat akun Operator.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Nama atau email }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/UserRole' } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, email, role, created_at], default: name } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Halaman pengguna
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserPage' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Pengguna]
      summary: Membuat pengguna beserta role dan scope
      description: Admin SSDM hanya dapat membuat Operator. Akun global tidak memiliki scope; Operator wajib memiliki minimal satu scope aktif.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserCreate' } }
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Pengguna]
      summary: Detail pengguna dan seluruh scope
      responses:
        '200':
          description: Detail pengguna
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna]
      summary: Memperbarui akun, role, status, dan mengganti kumpulan scope
      description: Pengguna tidak dapat mengubah akun sendiri. Password opsional; kirim kosong jika tidak diubah.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } }
      responses:
        '200':
          description: Pengguna diperbarui
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pengguna]
      summary: Menonaktifkan pengguna dan mencabut seluruh token
      description: Data akun tidak dihapus permanen. Akun dapat diaktifkan kembali melalui endpoint update.
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reference-options:
    get:
      tags: [Referensi]
      summary: Opsi form; unit dibatasi scope pengguna
      parameters:
        - { name: only, in: query, description: "bidang_fungsi untuk filter daftar, non_unit untuk referensi form, unit_organisasi untuk pencarian Satker terbatas 25 hasil.", schema: { type: string, enum: [bidang_fungsi, non_unit, unit_organisasi] } }
        - { name: search, in: query, description: "Wajib saat only=unit_organisasi; cari nama atau kode Satker, minimal 3 karakter.", schema: { type: string, minLength: 3, maxLength: 100 } }
      responses:
        '200':
          description: Data referensi aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pangkat: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
                      unit_organisasi: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
                      bidang_fungsi: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
                      jenis_kualifikasi: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
                      jenis_penugasan: { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /references/{type}:
    parameters:
      - $ref: '#/components/parameters/ReferenceType'
    get:
      tags: [Administrasi Referensi]
      summary: Daftar referensi; unit organisasi dibatasi scope Operator
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Daftar referensi dengan data, links, meta pagination, success, dan message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReferenceRecord' } }
                  links: { type: object }
                  meta: { type: object }
                  success: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Administrasi Referensi]
      summary: Tambah referensi oleh System Admin atau Admin SSDM
      description: Pangkat hanya dapat dikelola System Admin; Admin SSDM hanya membaca/memilih pangkat (mutasi data referensi pangkat ditolak 403). Kategori lain dikelola System Admin/Admin SSDM. Kolom khusus harus sesuai type URL. Unit non-root wajib memiliki induk; root tidak boleh memiliki induk. Unit aktif wajib berada di bawah induk aktif.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReferenceWrite' } }
      responses:
        '201':
          description: Referensi dibuat
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReferenceEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /references/{type}/{reference}:
    parameters:
      - $ref: '#/components/parameters/ReferenceType'
      - { name: reference, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Administrasi Referensi]
      summary: Detail referensi; unit di luar scope Operator ditolak
      responses:
        '200':
          description: Detail referensi
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReferenceEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Administrasi Referensi]
      summary: Perbarui atau aktifkan/nonaktifkan referensi
      description: Pangkat hanya dapat dipelihara System Admin (Admin SSDM ditolak 403). Kirim seluruh kolom wajib sesuai type. Siklus induk unit ditolak. Nonaktifkan bawahan aktif sebelum induk. Jenis personel pada pangkat yang sudah dipakai tidak dapat diganti.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReferenceWrite' } }
      responses:
        '200':
          description: Referensi diperbarui
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReferenceEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Administrasi Referensi]
      summary: Soft delete referensi yang belum digunakan
      description: Penghapusan referensi pangkat hanya oleh System Admin (Admin SSDM ditolak 403). Referensi yang masih dipakai personel, riwayat termasuk soft-deleted, scope, atau unit anak ditolak dengan 409. Gunakan status nonaktif untuk menghentikan penggunaan baru. Kode tetap unik setelah soft delete.
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /personel:
    get:
      tags: [Personel]
      summary: Daftar personel dalam scope pengguna
      parameters:
        - { name: arsip, in: query, schema: { type: boolean }, description: '1 untuk daftar arsip, hanya System Admin/Admin SSDM.' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Nama atau NRP/NIP }
        - { name: unit_organisasi_id, in: query, schema: { type: integer } }
        - { name: pangkat_id, in: query, schema: { type: integer } }
        - { name: bidang_fungsi_id, in: query, schema: { type: integer } }
        - { name: jenis_kualifikasi_id, in: query, schema: { type: integer } }
        - { name: operasi_wilayah, in: query, schema: { type: string, maxLength: 255 } }
        - { name: operasi_tingkat, in: query, schema: { $ref: '#/components/schemas/MeritLevel' } }
        - { name: operasi_bidang_fungsi_id, in: query, schema: { type: integer } }
        - { name: operasi_verifikasi, in: query, schema: { $ref: '#/components/schemas/MeritVerification' } }
        - { name: min_jumlah_operasi, in: query, schema: { type: integer, minimum: 1 } }
        - { name: min_durasi_operasi_hari, in: query, schema: { type: integer, minimum: 1 }, description: Akumulasi hari per operasi; periode yang beririsan dapat terhitung pada dua operasi. }
        - { name: jenis_personel, in: query, schema: { $ref: '#/components/schemas/JenisPersonel' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusPersonel' } }
        - name: sort
          in: query
          description: Urutan seluruh hasil sesuai filter/scope sebelum pagination. Nama, jabatan, dan Satker diurutkan tanpa membedakan huruf besar/kecil; teks tersimpan tidak diubah. Jabatan memakai jabatan utama aktif; jabatan/Satker kosong dianggap teks kosong, nilai sama diurutkan berdasarkan ID.
          schema: { type: string, enum: [nama, jabatan, satker, pangkat, terbaru, jumlah_kualifikasi, durasi_pengalaman, kualifikasi_terbaru, jumlah_operasi, durasi_operasi], default: nama }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Halaman personel beserta ringkasan faktual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonelPage'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Personel]
      summary: Registrasi personel beserta pendidikan dan riwayat awal secara atomik
      description: Pendidikan umum wajib, pendidikan Polri wajib untuk POLRI dan opsional bagi PNS. Riwayat tambahan opsional maksimum 20 per jenis. PDF privat opsional maksimal 5 MB per file, kirim nested form-data menggunakan bracket notation. File baru dibersihkan jika transaksi gagal. Jabatan terdahulu harus sudah selesai dan periode jabatan utama tidak boleh tumpang tindih.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonelCreate' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PersonelCreate' }
      responses:
        '201':
          description: Personel dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonelEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /personel/{personel}:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
    get:
      tags: [Personel]
      summary: Detail profil, kualifikasi, dan riwayat jabatan
      responses:
        '200':
          description: Detail personel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonelEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Personel]
      summary: Ubah identitas personel
      description: Unit organisasi tidak dapat diubah melalui endpoint ini; gunakan proses mutasi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonelUpdate' }
      responses:
        '200':
          description: Personel diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonelEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Personel]
      summary: Ubah sebagian identitas personel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonelUpdate' }
      responses:
        '200':
          description: Personel diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonelEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Personel]
      summary: Arsipkan personel (admin-only, alasan wajib)
      description: Tidak mengubah tanggal karier. Menonaktifkan akun/scope terkait dan mencabut token; pemeriksaan kewenangan kelola akun tetap berlaku. Bukan mekanisme pensiun atau mutasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan_arsip]
              properties:
                alasan_arsip: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /personel/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Personel]
      summary: Pulihkan arsip personel (admin-only)
      description: Riwayat dan tanggal asli dipertahankan. Akun/scope tidak otomatis diaktifkan kembali.
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /personel-options:
    get:
      tags: [Pengguna]
      summary: Cari personel aktif untuk pemilik akun (admin-only)
      parameters:
        - { name: search, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 100 } }
      responses:
        '200':
          description: Maksimum 25 hasil, terurut nama/id; personel arsip/nonaktif tidak ditampilkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/PersonnelAccountOption' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /personel/{personel}/kualifikasi:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
    get:
      tags: [Kualifikasi]
      summary: Daftar kualifikasi personel
      responses:
        '200':
          description: Daftar kualifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Kualifikasi' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Kualifikasi]
      summary: Tambah kualifikasi dengan PDF opsional
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/KualifikasiInput' }
      responses:
        '201':
          description: Kualifikasi dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KualifikasiEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /kualifikasi/{kualifikasi}:
    parameters:
      - $ref: '#/components/parameters/KualifikasiId'
    get:
      tags: [Kualifikasi]
      summary: Detail kualifikasi lengkap untuk membaca atau mengisi form edit
      responses:
        '200':
          description: Detail kualifikasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KualifikasiEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Kualifikasi]
      summary: Ubah kualifikasi
      description: Field yang tidak dikirim dipertahankan, null mengosongkan field opsional. Untuk upload PDF gunakan POST ke URL ini dengan form field _method=PUT (method override); ini diperlukan pada PHP 8.3. hapus_dokumen=true melepas PDF lama; PDF baru menggantikannya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/KualifikasiUpdate' }
          application/json:
            schema: { $ref: '#/components/schemas/KualifikasiUpdate' }
      responses:
        '200':
          description: Kualifikasi diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KualifikasiEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Kualifikasi]
      summary: Soft delete kualifikasi (dokumen tetap disimpan untuk arsip)
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /kualifikasi/{kualifikasi}/dokumen:
    parameters:
      - $ref: '#/components/parameters/KualifikasiId'
    get:
      tags: [Kualifikasi]
      summary: Download dokumen kualifikasi dari storage privat
      responses:
        '200':
          description: Berkas PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /personel/{personel}/riwayat-jabatan:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
    get:
      tags: [Riwayat Jabatan]
      summary: Daftar riwayat jabatan secara kronologis
      description: Urut tanggal mulai sebelum pagination; default terbaru dahulu, nilai sama memakai ID dengan arah yang sama.
      parameters:
        - in: query
          name: direction
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Daftar riwayat jabatan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RiwayatJabatan' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Riwayat Jabatan]
      summary: Tambah riwayat jabatan atau penugasan tambahan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RiwayatJabatanInput' }
      responses:
        '201':
          description: Riwayat dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiwayatJabatanEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /riwayat-jabatan/{riwayatJabatan}:
    parameters:
      - $ref: '#/components/parameters/RiwayatJabatanId'
    get:
      tags: [Riwayat Jabatan]
      summary: Detail riwayat jabatan lengkap untuk membaca atau mengisi form edit
      responses:
        '200':
          description: Detail riwayat jabatan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiwayatJabatanEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Riwayat Jabatan]
      summary: Ubah riwayat jabatan
      description: is_jabatan_utama tidak dapat diubah. Jabatan utama aktif tidak dapat diakhiri atau diubah unitnya melalui CRUD. Field yang tidak dikirim dipertahankan. Untuk upload PDF gunakan POST dengan _method=PUT; untuk melepas PDF kirim hapus_dokumen=true.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RiwayatJabatanUpdate' }
          application/json:
            schema: { $ref: '#/components/schemas/RiwayatJabatanUpdate' }
      responses:
        '200':
          description: Riwayat diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiwayatJabatanEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Riwayat Jabatan]
      summary: Soft delete riwayat selesai atau penugasan tambahan
      description: Jabatan utama aktif ditolak dengan HTTP 409.
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '409': { $ref: '#/components/responses/Conflict' }
  /riwayat-jabatan/{riwayatJabatan}/dokumen:
    parameters:
      - $ref: '#/components/parameters/RiwayatJabatanId'
    get:
      tags: [Riwayat Jabatan]
      summary: Download SK dari storage privat
      responses:
        '200':
          description: Berkas PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /personel/{personel}/ganti-jabatan:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
    post:
      tags: [Proses Jabatan]
      summary: Ganti jabatan utama dalam unit yang sama
      description: Menutup jabatan utama lama sehari sebelum tanggal mulai baru dan membuat jabatan baru dalam satu transaksi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/GantiJabatanInput' }
      responses:
        '200':
          description: Pergantian jabatan berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonelEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /personel/{personel}/mutasi:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
    post:
      tags: [Proses Jabatan]
      summary: Mutasi personel ke unit baru secara atomik
      description: Unit asal dan tujuan wajib berada dalam scope pengguna.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/GantiJabatanInput'
                - type: object
                  required: [unit_organisasi_id]
                  properties:
                    unit_organisasi_id: { type: integer }
      responses:
        '200':
          description: Mutasi berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonelEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /personel/{personel}/merit/{type}:
    parameters:
      - $ref: '#/components/parameters/PersonelId'
      - $ref: '#/components/parameters/MeritType'
    get:
      tags: [Profil Merit]
      summary: Daftar berhalaman penugasan operasi, prestasi, atau penghargaan dalam scope personel
      parameters:
        - { name: wilayah, in: query, schema: { type: string } }
        - { name: tingkat, in: query, schema: { $ref: '#/components/schemas/MeritLevel' } }
        - { name: bidang_fungsi_id, in: query, schema: { type: integer } }
        - { name: kategori, in: query, schema: { type: string }, description: Hanya berlaku untuk prestasi }
        - { name: status_verifikasi, in: query, schema: { $ref: '#/components/schemas/MeritVerification' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Halaman riwayat merit, content: { application/json: { schema: { $ref: '#/components/schemas/MeritPage' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Profil Merit]
      summary: Tambah satu fakta merit dengan PDF opsional
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MeritInput' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/MeritInput' } }
      responses:
        '201': { description: Dibuat dan belum diverifikasi, content: { application/json: { schema: { $ref: '#/components/schemas/MeritEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /merit/{type}/{record}:
    parameters:
      - $ref: '#/components/parameters/MeritType'
      - $ref: '#/components/parameters/MeritId'
    get:
      tags: [Profil Merit]
      summary: Detail satu fakta merit
      responses:
        '200': { description: Detail, content: { application/json: { schema: { $ref: '#/components/schemas/MeritEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Profil Merit]
      summary: Edit data; perubahan membatalkan verifikasi
      description: Untuk upload PDF dari PHP 8.3 gunakan POST multipart dengan _method=PUT. Hanya field yang dikirim diperbarui.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MeritInput' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/MeritInput' } }
      responses:
        '200': { description: Diperbarui, content: { application/json: { schema: { $ref: '#/components/schemas/MeritEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Profil Merit]
      summary: Arsipkan riwayat secara soft delete tanpa menghapus PDF
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /merit/{type}/{record}/verifikasi:
    parameters:
      - $ref: '#/components/parameters/MeritType'
      - $ref: '#/components/parameters/MeritId'
    post:
      tags: [Profil Merit]
      summary: Verifikasi atau batalkan oleh Admin SSDM/System Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_verifikasi]
              properties:
                status_verifikasi: { $ref: '#/components/schemas/MeritVerification' }
      responses:
        '200': { description: Status diperbarui, content: { application/json: { schema: { $ref: '#/components/schemas/MeritEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /merit/{type}/{record}/dokumen:
    parameters:
      - $ref: '#/components/parameters/MeritType'
      - $ref: '#/components/parameters/MeritId'
    get:
      tags: [Profil Merit]
      summary: Unduh PDF privat setelah pemeriksaan scope
      responses:
        '200': { description: PDF attachment, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    ReferenceType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [unit-organisasi, pangkat, bidang-fungsi, jenis-kualifikasi, jenis-penugasan] }
    UserId: { name: user, in: path, required: true, schema: { type: integer, minimum: 1 } }
    PersonelId: { name: personel, in: path, required: true, schema: { type: integer, minimum: 1 } }
    KualifikasiId: { name: kualifikasi, in: path, required: true, schema: { type: integer, minimum: 1 } }
    RiwayatJabatanId: { name: riwayatJabatan, in: path, required: true, schema: { type: integer, minimum: 1 } }
    MeritType: { name: type, in: path, required: true, schema: { type: string, enum: [penugasan-operasi, prestasi, penghargaan] } }
    MeritId: { name: record, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    SuccessMessage:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            type: object
            required: [success, message]
            properties:
              success: { type: boolean, const: true }
              message: { type: string }
    Unauthenticated:
      description: Token tidak ada atau tidak valid
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Forbidden:
      description: Data berada di luar role/scope pengguna
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Conflict:
      description: Operasi bertentangan dengan aturan domain
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    ValidationError:
      description: Data request tidak valid
      content:
        application/json: { schema: { $ref: '#/components/schemas/ValidationError' } }
    TooManyRequests:
      description: Rate limit terlampaui
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    ServiceUnavailable:
      description: Layanan tidak tersedia; detail internal tidak dibocorkan
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
  schemas:
    ReferenceWrite:
      type: object
      required: [kode, nama, is_active]
      description: "Kolom tambahan sesuai URL: unit-organisasi wajib jenis_unit, parent_id kecuali root; pangkat wajib jenis_personel dan urutan; bidang-fungsi memiliki deskripsi opsional. Kolom khusus kategori lain ditolak. Panjang kode maksimal unit/jenis-kualifikasi 50, pangkat/bidang-fungsi 30, jenis-penugasan 20."
      properties:
        kode: { type: string, maxLength: 50 }
        nama: { type: string, maxLength: 255 }
        is_active: { type: boolean }
        parent_id: { type: [integer, 'null'] }
        jenis_unit: { type: string, enum: [root, mabes, satker_mabes, polda, satker_polda, polres, satker_polres, polsek] }
        jenis_personel: { $ref: '#/components/schemas/JenisPersonel' }
        urutan: { type: integer, minimum: 0, maximum: 65535 }
        deskripsi: { type: [string, 'null'], maxLength: 2000 }
    ReferenceRecord:
      allOf:
        - $ref: '#/components/schemas/ReferenceWrite'
        - type: object
          properties:
            id: { type: integer }
            jenis_unit_label: { type: string }
            parent: { oneOf: [{ $ref: '#/components/schemas/ReferenceItem' }, { type: 'null' }] }
    ReferenceEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/ReferenceRecord' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, maxLength: 255 }
        device_name: { type: string, maxLength: 100 }
    JenisPersonel: { type: string, enum: [polri, pns] }
    StatusPersonel: { type: string, enum: [aktif, pensiun, nonaktif] }
    ReferenceItem:
      type: object
      properties:
        id: { type: integer }
        nama: { type: string }
    UserRole: { type: string, enum: [system_admin, admin_ssdm, operator] }
    ScopeType: { type: string, enum: [own_unit, unit_and_descendants] }
    UserScopeInput:
      type: object
      required: [unit_organisasi_id, scope_type, is_active]
      properties:
        unit_organisasi_id: { type: integer }
        scope_type: { $ref: '#/components/schemas/ScopeType' }
        is_active: { type: boolean }
        berlaku_mulai: { type: [string, 'null'], format: date }
        berlaku_sampai: { type: [string, 'null'], format: date }
    UserCreate:
      type: object
      description: Personel aktif wajib untuk akun staff; programmer eksternal boleh tanpa personel. Nama akun terkait ditentukan server, satu personel satu akun.
      required: [email, password, password_confirmation, role, is_active, scopes]
      properties:
        personel_id: { type: [integer, 'null'], description: Wajib kecuali role system_admin. }
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 10 }
        password_confirmation: { type: string, format: password }
        role: { $ref: '#/components/schemas/UserRole' }
        is_active: { type: boolean }
        scopes: { type: array, items: { $ref: '#/components/schemas/UserScopeInput' } }
    UserUpdate:
      type: object
      description: Pemilik akun yang sudah terhubung tidak dapat diganti/dilepas. Personel arsip/nonaktif boleh dipertahankan hanya jika akun tetap nonaktif. Akun staff lama yang belum terhubung wajib dipilihkan personel.
      required: [email, role, is_active, scopes]
      properties:
        personel_id: { type: [integer, 'null'] }
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: [string, 'null'], format: password, minLength: 10 }
        password_confirmation: { type: [string, 'null'], format: password }
        role: { $ref: '#/components/schemas/UserRole' }
        is_active: { type: boolean }
        scopes: { type: array, items: { $ref: '#/components/schemas/UserScopeInput' } }
    UserScope:
      allOf:
        - $ref: '#/components/schemas/UserScopeInput'
        - type: object
          properties:
            id: { type: integer }
            scope_type_label: { type: string }
            unit_organisasi: { $ref: '#/components/schemas/ReferenceItem' }
    User:
      type: object
      properties:
        id: { type: integer }
        personel_id: { type: [integer, 'null'] }
        personel: { oneOf: [{ $ref: '#/components/schemas/PersonnelAccountOption' }, { type: 'null' }], description: Disertakan pada endpoint administrasi pengguna. }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        role_label: { type: string }
        is_active: { type: boolean }
        scopes: { type: array, items: { $ref: '#/components/schemas/UserScope' } }
        permissions:
          type: object
          description: Hanya dikirim pada login dan auth/me; dihitung melalui policy backend.
          properties:
            create_personnel: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/User' }
    UserPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        links: { type: object }
        meta: { type: object }
    PersonelCreate:
      type: object
      required: [jenis_personel, nomor_identitas, nama_lengkap, pangkat_id, tempat_lahir, tanggal_lahir, unit_organisasi_id, status, pendidikan_umum]
      properties:
        pendidikan_umum:
